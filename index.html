<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CAMBIAR: nombre del restaurante -->
  <title>Urban Burger | Hamburguesas artesanales</title>

  <style>
    :root {
      /* ============================
         COLORES PRINCIPALES
         CAMBIA ESTO PARA CADA CLIENTE
         ============================ */
      --fondo: #0b0b0b;
      --fondo-secundario: #141414;
      --tarjeta: #181818;
      --borde: #2a2a2a;
      --principal: #f5b51b;
      --principal-claro: #ffd05a;
      --texto: #ffffff;
      --texto-secundario: #b8b8b8;
      --verde-whatsapp: #25d366;

      --radio: 18px;
      --ancho-maximo: 1200px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(245,181,27,.08), transparent 28%),
        var(--fondo);
      color: var(--texto);
      line-height: 1.6;
    }

    img {
      width: 100%;
      display: block;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .contenedor {
      width: min(92%, var(--ancho-maximo));
      margin: auto;
    }

    /* ============================
       HEADER
       ============================ */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(10,10,10,.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--borde);
    }

    .nav {
      min-height: 78px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 30px;
    }

    .marca {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 900;
      font-size: 24px;
    }

    .marca-icono {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--principal);
      color: #111;
      display: grid;
      place-items: center;
      font-size: 22px;
    }

    .marca span {
      color: var(--principal);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 28px;
      font-size: 14px;
      font-weight: 700;
    }

    .nav-links a {
      transition: .25s;
    }

    .nav-links a:hover {
      color: var(--principal);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--principal);
      color: #111;
      padding: 14px 22px;
      border-radius: 12px;
      font-weight: 900;
      transition: .25s;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: var(--principal-claro);
    }

    .btn-secundario {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #555;
      padding: 13px 20px;
      border-radius: 12px;
      font-weight: 800;
    }

    /* ============================
       HERO
       ============================ */

    .hero {
  min-height: 720px;
  display: flex;
  align-items: center;
  overflow: hidden;
  position: relative;
  background:
    radial-gradient(circle at 75% 45%, rgba(245,181,27,.12), transparent 30%),
    linear-gradient(135deg, #090909 0%, #111111 55%, #171717 100%);
}

.hero::before {
  content: "";
  position: absolute;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  background: rgba(245,181,27,.07);
  filter: blur(80px);
  right: 5%;
  top: 15%;
}

.hero-grid {
  display: grid;
  grid-template-columns: 1fr 1.1fr;
  align-items: center;
  gap: 30px;
  position: relative;
  z-index: 2;
}

.hero-contenido {
  max-width: 620px;
  padding: 90px 0;
}

.etiqueta {
  display: inline-block;
  color: var(--principal);
  border: 1px solid rgba(245,181,27,.35);
  background: rgba(245,181,27,.08);
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 1px;
  margin-bottom: 22px;
}

.hero h1 {
  font-size: clamp(58px, 7vw, 100px);
  line-height: .9;
  text-transform: uppercase;
  letter-spacing: -4px;
  margin-bottom: 25px;
}

.hero h1 span {
  display: block;
  color: var(--principal);
}

.hero p {
  max-width: 540px;
  color: #d0d0d0;
  font-size: 18px;
  margin-bottom: 32px;
}

.hero-botones {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
}

.hero-imagen {
  position: relative;
  height: 680px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero-imagen img {
  width: 120%;
  max-width: 760px;
  height: 620px;
  object-fit: cover;
  object-position: center;
  border-radius: 30px 0 0 30px;
  box-shadow: -30px 30px 80px rgba(0,0,0,.45);
}

.hero-imagen::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(90deg, #0b0b0b 0%, transparent 24%),
    linear-gradient(0deg, #0b0b0b 0%, transparent 18%);
  pointer-events: none;
}

@media (max-width: 1000px) {

  .hero-grid {
    grid-template-columns: 1fr;
  }

  .hero-contenido {
    padding: 80px 0 25px;
  }

  .hero-imagen {
    height: 500px;
  }

  .hero-imagen img {
    width: 100%;
    height: 500px;
    border-radius: 24px;
  }

}

@media (max-width: 650px) {

  .hero {
    min-height: auto;
  }

  .hero h1 {
    font-size: 54px;
    letter-spacing: -2px;
  }

  .hero p {
    font-size: 16px;
  }

  .hero-imagen {
    height: 390px;
    margin-bottom: 40px;
  }

  .hero-imagen img {
    height: 390px;
  }



    /* ============================
       BENEFICIOS
       ============================ */

    .beneficios {
      position: relative;
      z-index: 3;
      margin-top: -45px;
    }

    .beneficios-grid {
      background: var(--fondo-secundario);
      border: 1px solid var(--borde);
      border-radius: var(--radio);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .beneficio {
      padding: 28px;
      display: flex;
      gap: 16px;
      align-items: center;
      border-right: 1px solid var(--borde);
    }

    .beneficio:last-child {
      border-right: 0;
    }

    .beneficio-icono {
      font-size: 30px;
    }

    .beneficio h3 {
      color: var(--principal);
      font-size: 15px;
      margin-bottom: 3px;
      text-transform: uppercase;
    }

    .beneficio p {
      font-size: 13px;
      color: var(--texto-secundario);
    }

    /* ============================
       SECCIONES GENERALES
       ============================ */

    section {
      padding: 95px 0;
    }

    .titulo-pequeno {
      color: var(--principal);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-align: center;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .titulo {
      font-size: clamp(34px, 5vw, 54px);
      text-align: center;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 18px;
    }

    .titulo span {
      color: var(--principal);
    }

    .descripcion-seccion {
      max-width: 650px;
      text-align: center;
      color: var(--texto-secundario);
      margin: 0 auto 45px;
    }

    /* ============================
       CATEGORÍAS
       ============================ */

    .categorias-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 14px;
    }

    .categoria {
      background: linear-gradient(145deg, #191919, #111);
      border: 1px solid var(--borde);
      border-radius: 16px;
      padding: 24px 12px;
      text-align: center;
      transition: .25s;
    }

    .categoria:hover {
      transform: translateY(-5px);
      border-color: var(--principal);
    }

    .categoria .icono {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .categoria h3 {
      font-size: 14px;
      color: var(--principal);
      text-transform: uppercase;
    }

    .categoria p {
      color: var(--texto-secundario);
      font-size: 12px;
      margin-top: 5px;
    }

    /* ============================
       PRODUCTOS
       ============================ */

    .productos {
      background: var(--fondo-secundario);
    }

    .productos-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px;
    }

    .producto {
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 18px;
      overflow: hidden;
      transition: .25s;
    }

    .producto:hover {
      transform: translateY(-7px);
      border-color: var(--principal);
    }

    .producto-imagen {
      height: 240px;
      overflow: hidden;
    }

    .producto-imagen img {
      height: 100%;
      object-fit: cover;
      transition: .35s;
    }

    .producto:hover img {
      transform: scale(1.06);
    }

    .producto-info {
      padding: 20px;
    }

    .producto h3 {
      font-size: 19px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .producto p {
      color: var(--texto-secundario);
      font-size: 14px;
      min-height: 65px;
    }

    .producto-final {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
    }

    .precio {
      color: var(--principal);
      font-size: 22px;
      font-weight: 900;
    }

    .sumar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--principal);
      color: #111;
      font-size: 22px;
      font-weight: 900;
    }

    .menu-completo {
      text-align: center;
      margin-top: 38px;
    }

    /* ============================
       PROMOCIÓN
       ============================ */

    .promocion {
      padding-top: 40px;
    }

    .promo-box {
      background:
        linear-gradient(110deg, var(--principal) 0%, #ffc83d 70%);
      color: #121212;
      border-radius: 24px;
      padding: 42px 45px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 30px;
      overflow: hidden;
      position: relative;
    }

    .promo-box h2 {
      font-size: clamp(35px, 5vw, 60px);
      line-height: .95;
      text-transform: uppercase;
      max-width: 600px;
    }

    .promo-box p {
      font-weight: 700;
      margin-top: 15px;
    }

    .promo-icono {
      font-size: 115px;
      transform: rotate(-8deg);
    }

    /* ============================
       NOSOTROS
       ============================ */

    .nosotros-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 55px;
      align-items: center;
    }

    .nosotros-imagen img {
      height: 500px;
      object-fit: cover;
      border-radius: 24px;
    }

    .nosotros-texto h2 {
      font-size: clamp(38px, 5vw, 58px);
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 20px;
    }

    .nosotros-texto h2 span {
      color: var(--principal);
    }

    .nosotros-texto p {
      color: var(--texto-secundario);
      margin-bottom: 25px;
    }

    /* ============================
       INFO
       ============================ */

    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .info-card {
      background: var(--tarjeta);
      border: 1px solid var(--borde);
      border-radius: 18px;
      padding: 28px;
    }

    .info-card h3 {
      color: var(--principal);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .info-card p {
      color: var(--texto-secundario);
    }

    /* ============================
       FOOTER
       ============================ */

    footer {
      background: #070707;
      border-top: 1px solid var(--borde);
      padding: 65px 0 25px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.4fr repeat(3, 1fr);
      gap: 40px;
    }

    .footer-col h3 {
      margin-bottom: 14px;
      color: var(--principal);
    }

    .footer-col p,
    .footer-col a {
      color: #999;
      font-size: 14px;
      display: block;
      margin-bottom: 9px;
    }

    .copyright {
      border-top: 1px solid #1f1f1f;
      margin-top: 45px;
      padding-top: 20px;
      text-align: center;
      color: #666;
      font-size: 13px;
    }

    /* ============================
       WHATSAPP
       CAMBIAR NÚMERO PARA CLIENTE
       ============================ */

    .whatsapp {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--verde-whatsapp);
      color: #fff;
      font-size: 27px;
      z-index: 999;
      box-shadow: 0 12px 30px rgba(0,0,0,.4);
    }

    /* ============================
       RESPONSIVE
       ============================ */

    @media (max-width: 1000px) {
      .nav-links {
        display: none;
      }

      .categorias-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .productos-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .nosotros-grid {
        grid-template-columns: 1fr;
      }

      .footer-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 650px) {
      .nav {
        min-height: 68px;
      }

      .marca {
        font-size: 19px;
      }

      .nav .btn {
        padding: 10px 14px;
        font-size: 12px;
      }

      .hero {
        min-height: 650px;
        background-position: 62% center;
      }

      .hero h1 {
        letter-spacing: -2px;
      }

      .beneficios-grid {
        grid-template-columns: 1fr;
      }

      .beneficio {
        border-right: 0;
        border-bottom: 1px solid var(--borde);
      }

      .categorias-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .productos-grid {
        grid-template-columns: 1fr;
      }

      .promo-box {
        padding: 32px 25px;
      }

      .promo-icono {
        display: none;
      }

      .nosotros-imagen img {
        height: 350px;
      }

      .info-grid {
        grid-template-columns: 1fr;
      }

      .footer-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

      <div class="contenedor">

          <div class="etiqueta">
